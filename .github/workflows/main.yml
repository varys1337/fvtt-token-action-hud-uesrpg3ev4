name: Package Module Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create release archive from saved source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          manifest = json.loads(Path("module.json").read_text(encoding="utf-8"))
          tag = os.environ["RELEASE_TAG"]
          version = manifest["version"]
          if tag not in (version, f"v{version}"):
              raise SystemExit("Release tag must match module.json version")
          project = f"https://github.com/{os.environ['RELEASE_REPOSITORY']}"
          expected_manifest = f"{project}/releases/latest/download/module.json"
          expected_download = f"{project}/releases/download/{tag}/module.zip"
          if manifest.get("manifest") != expected_manifest or manifest.get("download") != expected_download:
              raise SystemExit("Manifest URLs must match this release")

          files = [Path(name) for name in ("module.json", "readme.md", "CHANGELOG.md")]
          for directory in ("languages", "scripts", "styles", "maintenance"):
              path = Path(directory)
              if not path.is_dir():
                  raise SystemExit(f"Missing release directory: {directory}")
              files.extend(item for item in path.rglob("*") if item.is_file())
          if Path("LICENSE").is_file():
              files.append(Path("LICENSE"))
          with ZipFile("module.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(files):
                  archive.write(path, path.as_posix())
          PY

      - name: Upload manifest and module archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" module.json module.zip --clobber
